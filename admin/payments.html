<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>การชำระเงิน | LockerGo</title>
<meta name="description" content="ตรวจสอบรายการชำระเงิน สถานะการชำระ คืนเงิน และส่งออกรายงานเป็นไฟล์ CSV ของ LockerGo">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/custom.css" rel="stylesheet">
<link href="../assets/css/admin.css" rel="stylesheet">
<script src="../assets/js/config.js"></script>
</head>
<body data-shell="admin" data-page="payments">
<a class="visually-hidden-focusable" href="#main">ข้ามไปยังเนื้อหา</a>
<div class="admin-wrap"><aside id="admin-sidebar"></aside>
  <div class="admin-main"><div id="admin-topbar"></div>
    <main id="main" class="admin-content" data-title="การชำระเงิน">

      <!-- summary cards -->
      <section aria-labelledby="summary-heading" class="mb-4">
        <h2 id="summary-heading" class="visually-hidden">สรุปการชำระเงิน</h2>
        <div class="row g-3">
          <div class="col-6 col-xl-3">
            <div class="card kpi-card h-100"><div class="card-body d-flex align-items-center gap-3">
              <span class="icon-circle"><i class="bi bi-cash-coin" aria-hidden="true"></i></span>
              <div><div class="small text-body-secondary">ยอดชำระแล้วรวม</div><div class="kpi-value" id="sum-paid">-</div></div>
            </div></div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card kpi-card h-100"><div class="card-body d-flex align-items-center gap-3">
              <span class="icon-circle"><i class="bi bi-hourglass-split" aria-hidden="true"></i></span>
              <div><div class="small text-body-secondary">รอชำระ (รายการ)</div><div class="kpi-value" id="sum-pending">-</div></div>
            </div></div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card kpi-card h-100"><div class="card-body d-flex align-items-center gap-3">
              <span class="icon-circle"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i></span>
              <div><div class="small text-body-secondary">ยอดคืนเงินรวม</div><div class="kpi-value" id="sum-refunded">-</div></div>
            </div></div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card kpi-card h-100"><div class="card-body d-flex align-items-center gap-3">
              <span class="icon-circle"><i class="bi bi-receipt" aria-hidden="true"></i></span>
              <div><div class="small text-body-secondary">รายการทั้งหมด</div><div class="kpi-value" id="sum-count">-</div></div>
            </div></div>
          </div>
        </div>
      </section>

      <!-- filters -->
      <form class="card card-soft mb-3" id="filters" role="search" aria-label="ค้นหาและกรองรายการชำระเงิน">
        <div class="card-body">
          <div class="row g-2 align-items-end">
            <div class="col-12 col-md-5">
              <label for="f-q" class="form-label small mb-1">ค้นหา</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
                <input type="search" class="form-control" id="f-q" placeholder="รหัสการจอง หรือชื่อลูกค้า" autocomplete="off">
              </div>
            </div>
            <div class="col-6 col-md-3">
              <label for="f-status" class="form-label small mb-1">สถานะ</label>
              <select class="form-select" id="f-status">
                <option value="">ทั้งหมด</option>
                <option value="paid">ชำระแล้ว</option>
                <option value="pending">รอชำระ</option>
                <option value="refunded">คืนเงินแล้ว</option>
              </select>
            </div>
            <div class="col-6 col-md-4">
              <label for="f-sort" class="form-label small mb-1">เรียงตาม</label>
              <select class="form-select" id="f-sort">
                <option value="date_desc">วันที่ (ใหม่ไปเก่า)</option>
                <option value="date_asc">วันที่ (เก่าไปใหม่)</option>
                <option value="amount_desc">จำนวนเงิน (มากไปน้อย)</option>
                <option value="amount_asc">จำนวนเงิน (น้อยไปมาก)</option>
              </select>
            </div>
          </div>
        </div>
      </form>

      <!-- table -->
      <section aria-labelledby="list-heading">
        <h2 id="list-heading" class="visually-hidden">รายการชำระเงิน</h2>
        <div class="card card-soft table-card">
          <div id="list-area" class="p-3"><div class="placeholder-glow" aria-hidden="true"><span class="placeholder col-12 rounded mb-2 py-3"></span><span class="placeholder col-12 rounded mb-2 py-3"></span><span class="placeholder col-12 rounded mb-2 py-3"></span><span class="placeholder col-12 rounded mb-2 py-3"></span><span class="placeholder col-12 rounded mb-2 py-3"></span></div><span class="visually-hidden" role="status">กำลังโหลด...</span></div>
          <div class="card-footer bg-transparent d-flex flex-wrap align-items-center gap-2 justify-content-between">
            <span class="small text-body-secondary" id="result-count" aria-live="polite"></span>
            <div id="pager"></div>
          </div>
        </div>
      </section>

    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/mock-service.js"></script>
<script src="../assets/js/api-client.js"></script>
<script src="../assets/js/data-service.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
(async () => {
  const user = await Admin.ready;
  const PER = 10;
  const $ = (s) => document.querySelector(s);
  const state = { rows: [], status: '', q: '', sort: 'date_desc', page: 1 };
  const area = $('#list-area');
  const pid = (id) => '#' + String(id).padStart(5, '0');

  $('#page-actions').innerHTML = '<button type="button" class="btn btn-outline-primary" id="btn-csv"><i class="bi bi-download me-1" aria-hidden="true"></i>ส่งออก CSV</button>';

  const sorters = {
    date_desc: (a, b) => String(b.createdAt).localeCompare(String(a.createdAt)) || b.id - a.id,
    date_asc: (a, b) => String(a.createdAt).localeCompare(String(b.createdAt)) || a.id - b.id,
    amount_desc: (a, b) => b.amount - a.amount || b.id - a.id,
    amount_asc: (a, b) => a.amount - b.amount || a.id - b.id,
  };
  const sorted = () => [...state.rows].sort(sorters[state.sort]);

  function renderSummary(all) {
    const sum = (st) => all.filter((p) => p.status === st).reduce((s, p) => s + +p.amount, 0);
    $('#sum-paid').textContent = LG.fmt.baht(sum('paid'));
    $('#sum-pending').textContent = all.filter((p) => p.status === 'pending').length.toLocaleString('th-TH');
    $('#sum-refunded').textContent = LG.fmt.baht(sum('refunded'));
    $('#sum-count').textContent = all.length.toLocaleString('th-TH');
  }

  function render() {
    const items = sorted();
    const { rows, page } = LG.paginate(items, state.page, PER);
    state.page = page;
    $('#result-count').textContent = items.length ? `แสดง ${rows.length} จาก ${items.length} รายการ` : '';
    if (!items.length) {
      area.className = 'p-3';
      area.innerHTML = LG.empty('ไม่พบรายการชำระเงินตามเงื่อนไข', 'credit-card');
      $('#pager').innerHTML = '';
      return;
    }
    area.className = '';
    area.innerHTML = `<div class="table-responsive"><table class="table table-hover align-middle">
      <caption class="visually-hidden">รายการชำระเงิน</caption>
      <thead><tr><th scope="col">รหัสชำระเงิน</th><th scope="col">การจอง</th><th scope="col">ลูกค้า</th><th scope="col" class="text-end">จำนวนเงิน</th><th scope="col">วิธีชำระ</th><th scope="col">สถานะ</th><th scope="col">วันที่</th><th scope="col" class="text-end">จัดการ</th></tr></thead>
      <tbody>${rows.map((p) => `<tr>
        <td class="text-nowrap fw-semibold">${pid(p.id)}</td>
        <td class="text-nowrap"><a href="bookings.html?q=${encodeURIComponent(p.bookingRef || '')}">${LG.esc(p.bookingRef || '-')}</a></td>
        <td>${LG.esc(p.customerName || '-')}</td>
        <td class="text-end text-nowrap">${LG.fmt.baht(p.amount)}</td>
        <td class="text-nowrap">${LG.esc(LG.PAY_METHODS[p.method] || p.method)}</td>
        <td>${LG.badge('payment', p.status)}</td>
        <td class="text-nowrap">${LG.fmt.datetime(p.createdAt)}</td>
        <td class="text-end">${p.status === 'paid' ? `<button type="button" class="btn btn-outline-danger btn-sm text-nowrap" data-refund="${p.id}"><i class="bi bi-arrow-counterclockwise me-1" aria-hidden="true"></i>คืนเงิน<span class="visually-hidden"> รายการ ${pid(p.id)}</span></button>` : '<span class="text-body-secondary" aria-label="ไม่มีการดำเนินการ">-</span>'}</td>
      </tr>`).join('')}</tbody></table></div>`;
    area.querySelectorAll('[data-refund]').forEach((b) => b.addEventListener('click', () => refund(state.rows.find((p) => p.id === +b.dataset.refund), b)));
    LG.pager($('#pager'), { total: items.length, page, per: PER }, (p) => { state.page = p; render(); });
  }

  async function loadSummary() {
    try { renderSummary(await DS.getPayments({})); } catch (e) { /* summary is secondary; table shows errors */ }
  }

  let loadSeq = 0;
  async function load() {
    const seq = ++loadSeq;
    area.className = 'p-3';
    area.innerHTML = LG.skeleton();
    $('#pager').innerHTML = '';
    $('#result-count').textContent = '';
    try {
      const filters = {};
      if (state.status) filters.status = state.status;
      if (state.q.trim()) filters.q = state.q.trim();
      const rows = await DS.getPayments(filters);
      if (seq !== loadSeq) return;
      state.rows = rows;
      render();
    } catch (e) {
      if (seq !== loadSeq) return;
      area.className = 'p-3';
      area.innerHTML = LG.errorBox(e);
      $('#pager').innerHTML = '';
      $('#result-count').textContent = '';
    }
  }

  async function refund(p, btn) {
    const ok = await LG.confirm({
      title: 'คืนเงิน',
      message: `ต้องการคืนเงิน ${LG.fmt.baht(p.amount)} สำหรับการจอง ${p.bookingRef || ''} (${pid(p.id)}) ให้ ${p.customerName || 'ลูกค้า'} หรือไม่`,
      okText: 'ยืนยันคืนเงิน', danger: true,
    });
    if (!ok) return;
    await LG.busy(btn, async () => {
      try {
        await DS.refundPayment(p.id);
        LG.toast(`คืนเงินรายการ ${pid(p.id)} เรียบร้อย`);
        await Promise.all([load(), loadSummary()]);
      } catch (e) { LG.toastError(e); }   // 409 not_refundable
    });
  }

  $('#btn-csv').addEventListener('click', () => {
    const items = sorted();
    if (!items.length) { LG.toast('ไม่มีข้อมูลสำหรับส่งออก', 'warning'); return; }
    const head = ['รหัสชำระเงิน', 'รหัสการจอง', 'ลูกค้า', 'จำนวนเงิน', 'วิธีชำระ', 'สถานะ', 'วันที่'];
    const body = items.map((p) => [pid(p.id), p.bookingRef || '', p.customerName || '', p.amount, LG.PAY_METHODS[p.method] || p.method, (LG.STATUS.payment[p.status] || [p.status])[0], LG.fmt.datetime(p.createdAt)]);
    LG.csv(`payments-${LG.fmt.isoDate()}.csv`, [head, ...body]);
    LG.toast(`ส่งออก ${items.length} รายการเรียบร้อย`);
  });

  let timer;
  $('#f-q').addEventListener('input', (e) => { clearTimeout(timer); timer = setTimeout(() => { state.q = e.target.value; state.page = 1; load(); }, 250); });
  $('#f-status').addEventListener('change', (e) => { state.status = e.target.value; state.page = 1; load(); });
  $('#f-sort').addEventListener('change', (e) => { state.sort = e.target.value; state.page = 1; render(); });
  $('#filters').addEventListener('submit', (e) => { e.preventDefault(); clearTimeout(timer); state.q = $('#f-q').value; state.page = 1; load(); });

  load();
  loadSummary();
})();
</script>
</body>
</html>
